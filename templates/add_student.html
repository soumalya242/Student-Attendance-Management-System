<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="brand">
            <span class="brand-icon">🎓</span>
            <span>Student Attendance System</span>
        </div>

        <nav>
            <a href="/">⌂ Home</a>
            <a class="active" href="/students">♟ Students</a>
            <a href="/attendance">▦ Attendance</a>
            <a href="/attendance_records">▤ Records</a>
        </nav>
    </header>

    <main class="dashboard">

        <section class="page-header">
            <div>
                <h1>Register New Student</h1>
                <p>Fill in the details below to add a student to the system.</p>
            </div>
            <a class="back-button" href="/students">← Back to Students</a>
        </section>

        <section class="form-card">
            <div class="card-icon blue">♟</div>

            <form action="/add" method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" name="roll_no" placeholder="e.g. CS101" required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" name="department" placeholder="e.g. CSE" required>
                </div>

                <button type="submit" class="submit-button">Add Student</button>

            </form>
        </section>

    </main>

    <footer class="footer">
        <span>© 2026 Student Attendance Management System</span>
        <span>Simple&nbsp; • &nbsp;Reliable&nbsp; • &nbsp;Efficient</span>
    </footer>

</body>
</html>
